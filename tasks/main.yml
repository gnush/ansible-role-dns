---
- name: Install Bind9 packages
  ansible.builtin.package:
    name: "{{ dns_bind_packages }}"
    state: present

- name: Populate package facts
  ansible.builtin.package_facts:

# BIND >= 9.20 packages replace named.conf.default-zones with named.conf.root-hints.
# Version carries a Debian epoch ("1:9.20..."), which the version test misreads.
- name: Select default zones file
  ansible.builtin.set_fact:
    dns_bind_default_zones_file: >-
      {{ 'named.conf.root-hints'
         if ansible_facts.packages['bind9'][0].version.split(':')[-1] is version('9.20', '>=')
         else 'named.conf.default-zones' }}

- name: Ensure bind config directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ dns_bind_etc_dir }}", group: "bind", mode: "0755" }
    - { path: "{{ dns_bind_zones_dir }}", group: "bind", mode: "0750" }

- name: Deploy named.conf.options
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: "{{ dns_bind_etc_dir }}/named.conf.options"
    owner: root
    group: bind
    mode: "0644"
    validate: "named-checkconf %s"
  notify: Restart bind9

- name: Initialize dns zones
  ansible.builtin.set_fact:
    dns_zones: []

- name: Gather dns zones
  ansible.builtin.set_fact:
    dns_zones: "{{ (dns_zones | default([])) + [lookup('file', item) | from_yaml] }}"
  with_fileglob: "{{ dns_zones_dir }}/*.yml"

- name: Ensure Unix Timestamp is available
  ansible.builtin.setup:
    gather_subset:
      - 'date_time'

# Single guard for split-horizon: enabled without records is a noop. The templates
# render views only if this block produced dns_split_views.
- name: Roll out split-horizon views
  when:
    - dns_split_horizon_enabled | bool
    - dns_split_records | length > 0
  block:
    - name: Build split-horizon views (one per client network, most specific first)
      ansible.builtin.set_fact:
        dns_split_views: >-
          {%- set nets = [] -%}
          {%- for r in dns_split_records -%}
          {%-   for c in r.answers -%}
          {%-     if c not in nets -%}{%- set _ = nets.append(c) -%}{%- endif -%}
          {%-   endfor -%}
          {%- endfor -%}
          {%- set views = [] -%}
          {%- for c in nets -%}
          {%-   set recs = [] -%}
          {%-   for r in dns_split_records if c in r.answers -%}
          {%-     set _ = recs.append({'name': r.name, 'type': r.type | default('A'),
                                       'ttl': r.ttl | default(300), 'value': r.answers[c]}) -%}
          {%-   endfor -%}
          {%-   set _ = views.append({'name': 'seg-' ~ c | replace('.', '-') | replace('/', '-'),
                                      'cidr': c, 'prefix': c.split('/')[1] | int,
                                      'records': recs}) -%}
          {%- endfor -%}
          {{ views | sort(attribute='prefix', reverse=true) }}

    - name: Ensure split-horizon view directories exist
      ansible.builtin.file:
        path: "{{ dns_bind_zones_dir }}/views/{{ item.name }}"
        state: directory
        owner: root
        group: bind
        mode: "0750"
      loop: "{{ dns_split_views }}"

    # Rendered on primary AND secondary: override zones are not transferred.
    - name: Deploy split-horizon override zone files
      ansible.builtin.template:
        src: split.db.j2
        dest: "{{ dns_bind_zones_dir }}/views/{{ item.0.name }}/db.{{ item.1.name }}"
        owner: root
        group: bind
        mode: "0640"
        validate: "named-checkzone {{ item.1.name }} %s"
      loop: "{{ dns_split_views | subelements('records') }}"
      notify: Restart bind9

- name: Deploy named.conf.local (zones)
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: "{{ dns_bind_etc_dir }}/named.conf.local"
    owner: root
    group: bind
    mode: "0644"
    validate: "named-checkconf %s"
  notify: Restart bind9

# Serial is bumped only when the zone content changes
- name: Roll out master zones
  when: dns_role == "primary"
  block:
    - name: Read deployed zone files
      ansible.builtin.slurp:
        src: "{{ dns_bind_zones_dir }}/db.{{ item.name }}"
      loop: "{{ dns_zones }}"
      register: dns_zone_current
      failed_when: false

    - name: Collect deployed zone serials
      ansible.builtin.set_fact:
        dns_zone_serials: >-
          {{ dns_zone_serials | default({}) | combine({item.item.name:
             item.content | b64decode | regex_search('(\d+) ; Serial', '\1') | first}) }}
      loop: "{{ dns_zone_current.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.content is defined

    # check mode with the deployed serial
    - name: Compare zone content
      ansible.builtin.template:
        src: zone.db.j2
        dest: "{{ dns_bind_zones_dir }}/db.{{ item.name }}"
        owner: root
        group: bind
        mode: "0640"
      vars:
        dns_zone_serial: "{{ dns_zone_serials[item.name] | default(ansible_facts['date_time']['epoch']) }}"
      loop: "{{ dns_zones }}"
      check_mode: true
      register: dns_zone_diff

    # idx pairs each zone with its Compare result; both tasks loop over dns_zones in the same order
    - name: Deploy master zone files
      ansible.builtin.template:
        src: zone.db.j2
        dest: "{{ dns_bind_zones_dir }}/db.{{ item.name }}"
        owner: root
        group: bind
        mode: "0640"
        validate: "named-checkzone {{ item.name }} %s"
      vars:
        dns_zone_serial: >-
          {{ ansible_facts['date_time']['epoch'] if dns_zone_diff.results[idx].changed
             else dns_zone_serials[item.name] }}
      loop: "{{ dns_zones }}"
      loop_control:
        index_var: idx
      notify: Restart bind9

# Deployed last: validates the full config including the files above.
- name: Deploy named.conf
  ansible.builtin.template:
    src: named.conf.j2
    dest: "{{ dns_bind_etc_dir }}/named.conf"
    owner: root
    group: bind
    mode: "0644"
    validate: "named-checkconf -z %s"
  notify: Restart bind9

# The fragment validations above cannot see view/top-level conflicts.
- name: Check full bind configuration
  ansible.builtin.command: "named-checkconf -z {{ dns_bind_etc_dir }}/named.conf"
  changed_when: false

- name: Ensure bind9 service enabled and started
  ansible.builtin.service:
    name: "{{ dns_bind_service_name }}"
    enabled: true
    state: started
...
