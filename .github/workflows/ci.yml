---
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: pip install ansible-core ansible-lint

      - name: Lint
        run: ansible-lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - debian12
          - debian13
          - ubuntu2204
          - ubuntu2404
          - ubuntu2604
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: pip install ansible-core molecule molecule-plugins[docker]

      - name: Molecule
        run: molecule test --platform-name ${{ matrix.platform }} --destroy never
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Bind logs
        if: failure()
        run: |
          docker exec ${{ matrix.platform }} systemctl status named --no-pager || true
          docker exec ${{ matrix.platform }} journalctl -xeu named --no-pager || true
          sudo dmesg | grep -i 'apparmor="DENIED"' | tail -20 || true
...
